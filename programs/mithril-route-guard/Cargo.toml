[package]
name = "mithril-route-guard"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pinocchio = { version = "=0.11.2", default-features = false, features = ["alloc", "cpi"] }

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
