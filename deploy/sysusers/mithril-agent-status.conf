g mithril-agent -
g mithril-agent-quote -
g mithril-node-state -
g mithril-agent-status -
g mithril-agent-status-bridge -
g mithril-agent-telegram -
u mithril-agent -:mithril-agent "Mithril autonomous operations agent" /var/lib/mithril-agent /usr/sbin/nologin
u mithril-agent-quote -:mithril-agent-quote "Mithril quote service" - /usr/sbin/nologin
u mithril-agent-status-bridge -:mithril-agent-status-bridge "Mithril bounded status bridge" - /usr/sbin/nologin
u mithril-agent-telegram -:mithril-agent-telegram "Mithril Telegram operator" /var/lib/mithril-agent-telegram /usr/sbin/nologin
m mithril-agent-telegram mithril-agent-status
