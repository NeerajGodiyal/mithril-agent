[Unit]
Wants=mithril-agent-paper-status.socket mithril-agent-paper-jup-status.socket mithril-agent-market-paper-status@wif.socket mithril-agent-market-paper-status@jto.socket mithril-agent-market-paper-status@pyth.socket
After=mithril-agent-paper-status.socket mithril-agent-paper-jup-status.socket mithril-agent-perps-paper.service mithril-agent-perps-paper-status@sol.socket mithril-agent-perps-paper-status@btc.socket mithril-agent-perps-paper-status@eth.socket mithril-agent-market-paper-status@wif.socket mithril-agent-market-paper-status@jto.socket mithril-agent-market-paper-status@pyth.socket

[Service]
ExecStart=
ExecStart=/usr/local/libexec/mithril-agent/mithril-agent-telegram --status-socket /run/mithril-agent-status.sock --paper-status-socket SOL/USDC=/run/mithril-agent-paper-status.sock --paper-status-socket JUP/USDC=/run/mithril-agent-paper-jup-status.sock --optional-paper-status-socket SOL-PERP=/run/mithril-agent-perps-sol-paper-status.sock --optional-paper-status-socket BTC-PERP=/run/mithril-agent-perps-btc-paper-status.sock --optional-paper-status-socket ETH-PERP=/run/mithril-agent-perps-eth-paper-status.sock --optional-paper-status-socket WIF/USDC=/run/mithril-agent-market-wif-paper-status.sock --optional-paper-status-socket JTO/USDC=/run/mithril-agent-market-jto-paper-status.sock --optional-paper-status-socket PYTH/USDC=/run/mithril-agent-market-pyth-paper-status.sock --cursor /var/lib/mithril-agent-telegram/update-cursor.json
