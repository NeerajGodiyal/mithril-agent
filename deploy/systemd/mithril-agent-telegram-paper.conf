[Unit]
Wants=mithril-agent-paper-status.socket mithril-agent-paper-jup-status.socket
After=mithril-agent-paper-status.socket mithril-agent-paper-jup-status.socket

[Service]
ExecStart=
ExecStart=/usr/local/libexec/mithril-agent/mithril-agent-telegram --status-socket /run/mithril-agent-status.sock --paper-status-socket SOL/USDC=/run/mithril-agent-paper-status.sock --paper-status-socket JUP/USDC=/run/mithril-agent-paper-jup-status.sock --cursor /var/lib/mithril-agent-telegram/update-cursor.json
