_config_version: 39

model:
  provider: openai-codex
  default: gpt-5.6-terra

web:
  keyless_fallback: true
  keyless_rescue: true

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

approvals:
  mode: manual
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true

auxiliary:
  background_review:
    enabled: false

delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: false

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true
  nudge_interval: 0

skills:
  creation_nudge_interval: 0
  guard_agent_created: true
  write_approval: true

agent:
  max_turns: 60
  run_budget_seconds: 300
  reasoning_effort: high
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - skills
    - memory
    - session_search
    - cronjob
    - kanban
    - computer_use
    - project
    - desktop_ui
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - image_gen
    - video_gen
    - tts

security:
  allow_private_urls: false
  redact_secrets: true
  allow_lazy_installs: false
  tirith_enabled: false
  tirith_fail_open: false
  website_blocklist:
    enabled: true
    domains:
      - "*.local"
      - "*.internal"
      - localhost
    shared_files: []

cron:
  allow_agent_scheduling: false

group_sessions_per_user: true
unauthorized_dm_behavior: ignore

platforms:
  telegram:
    enabled: false

platform_toolsets:
  cli:
    - web
    - delegation
    - mithril_index
    - solana_docs

mcp_servers:
  mithril_index:
    command: /opt/mithril/bin/mithril-agent
    args:
      - index
      - mcp
      - --dir
      - /var/lib/mithril-agent/index
      - --max-record-age
      - 15m
    enabled: true
    trust: full
    timeout: 30
    connect_timeout: 15
    tools:
      include:
        - mithril_index_status
        - mithril_index_accounts
        - mithril_index_transactions
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false

  solana_docs:
    url: https://mcp.solana.com/mcp
    enabled: true
    trust: full
    timeout: 60
    connect_timeout: 30
    tools:
      include:
        - list_sections
        - get_documentation
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false

telemetry:
  shared_metrics:
    enabled: false

plugins:
  enabled: []
