services:
  hermes-research:
    image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
    container_name: hermes-research
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    command:
      - hermes
      - chat
      - --query-file
      - /opt/mithril/prompts/market-scout.md
      - --provider
      - openai-codex
      - --model
      - gpt-5.6-terra
      - --reasoning
      - high
      - --toolsets
      - "${MITHRIL_HERMES_TOOLSETS:-web,solana_docs}"
      - --run-budget
      - "300"
      - --quiet
    environment:
      HERMES_UID: "${MITHRIL_UID:?set MITHRIL_UID}"
      HERMES_GID: "${MITHRIL_GID:?set MITHRIL_GID}"
    volumes:
      - ./state:/opt/data
      - type: bind
        source: /usr/local/libexec/mithril-agent/mithril-agent
        target: /opt/mithril/bin/mithril-agent
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/mithril-hermes-research/prompts/market-scout.md
        target: /opt/mithril/prompts/market-scout.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/index
        target: /var/lib/mithril-agent/index
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/policy
        target: /var/lib/mithril-agent-research/policy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/journals
        target: /var/lib/mithril-agent-research/journals
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/champion
        target: /var/lib/mithril-agent-research/champion
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/challenger
        target: /var/lib/mithril-agent-research/challenger
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/runs/champion
        target: /var/lib/mithril-agent-research/runs/champion
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/mithril-agent-research/runs/challenger
        target: /var/lib/mithril-agent-research/runs/challenger
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    name: mithril-hermes-research
    external: true
